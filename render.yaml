# Render Blueprint. Si el servicio se creó a mano (sin Blueprint), copia
# buildCommand y startCommand en Settings → Build & Deploy del panel de Render.
services:
  - type: web
    name: mi-pronostico-deportivo
    runtime: node
    plan: free
    region: oregon
    # --include=dev: Vite y Tailwind son dependencias de compilación.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Acceso (obligatorio: sin estas dos variables la app responde 503)
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Proveedores de datos
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: BIGBALLS_KEY
        sync: false
      # PostgreSQL: apuestas simuladas, caché y consumo de cuota persistentes
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      # Banca
      - key: CURRENCY
        value: MXN
      - key: STAKE
        value: "100"
      - key: BANKROLL
        value: "5000"
      - key: KELLY_FRACTION
        value: "0.25"
      - key: MAX_STAKE_PCT
        value: "0.02"
      # The Odds API (plan gratuito: 500 créditos/mes)
      - key: ODDS_MARKETS
        value: h2h,totals,spreads
      - key: ODDS_EXTRA_MARKETS
        value: btts,double_chance
      - key: ODDS_EXTRAS_DAILY_BUDGET
        value: "4"
      - key: ODDS_CACHE_MINUTES
        value: "240"
      - key: ODDS_DAILY_CREDIT_BUDGET
        value: "16"
      - key: ODDS_CLOSING_RESERVE_CREDITS
        value: "6"
      - key: ODDS_RESERVE_CREDITS
        value: "20"
      - key: TRACK_CLOSING_ODDS
        value: "true"
      # v10: motor de valor, calibración y paper trading
      - key: EXECUTION_BOOKMAKER
        sync: false
      - key: VALUE_MIN_EV
        value: "0.05"
      - key: VALUE_MAX_MARKET_GAP
        value: "0.10"
      - key: VALUE_MIN_ODDS
        value: "1.50"
      - key: VALUE_MAX_ODDS
        value: "4.00"
      - key: VALUE_MAX_BETS_PER_JORNADA
        value: "3"
      - key: TRADING_MODE
        value: paper
      - key: CALIBRATION_METHOD
        value: auto
      - key: SIGNAL_SCAN_EVERY_MINUTES
        value: "120"
