# Render Blueprint. Si el servicio se creó a mano (sin Blueprint), copia
# buildCommand y startCommand en Settings → Build & Deploy del panel de Render.
services:
  - type: web
    name: mi-pronostico-deportivo
    runtime: node
    plan: free
    region: oregon
    # --include=dev: Vite y Tailwind son dependencias de compilación.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Acceso (obligatorio: sin estas dos variables la app responde 503)
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Proveedores de datos
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: BIGBALLS_KEY
        sync: false
      # PostgreSQL: apuestas simuladas, caché y consumo de cuota persistentes
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      # Banca
      - key: CURRENCY
        value: MXN
      - key: STAKE
        value: "100"
      - key: BANKROLL
        value: "5000"
      - key: KELLY_FRACTION
        value: "0.25"
      - key: MAX_STAKE_PCT
        value: "0.02"
      # Protección de créditos de The Odds API
      - key: ODDS_CACHE_MINUTES
        value: "20"
      - key: ODDS_DAILY_CREDIT_BUDGET
        value: "15"
      - key: ODDS_RESERVE_CREDITS
        value: "40"
      - key: TRACK_CLOSING_ODDS
        value: "true"
      - key: ODDS_MARKETS
        value: h2h,totals,spreads
      # Motor de valor V10 (LaLiga + Champions, ejecución en Caliente MX)
      - key: PAPER_TRADING
        value: "true"
      - key: ENGINE_MIN_EV
        value: "0.05"
      - key: ENGINE_MAX_MARKET_GAP
        value: "0.10"
      - key: ENGINE_MIN_ODDS
        value: "1.50"
      - key: ENGINE_MAX_ODDS
        value: "4.00"
      - key: ENGINE_MAX_BETS_PER_MATCHDAY
        value: "3"
      - key: CALIENTE_FEED_URL
        sync: false
      - key: CALIENTE_FEED_TOKEN
        sync: false
