plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mipronosticodeportivo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mipronosticodeportivo'
        // minSdk 26: iconos adaptativos sin PNG de respaldo
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '10.1.0'
    }

    // La firma de release se lee de variables de entorno (secretos de GitHub Actions).
    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
