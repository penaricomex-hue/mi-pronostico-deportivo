name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTA: quitamos "android-actions/setup-android@v3" â€” tiene un bug
      # conocido: descarga una versiÃ³n de cmdline-tools que no coincide
      # con la preinstalada en el runner, y su propio paso interno de
      # licencias falla de forma no interactiva ("6 of 7 SDK package
      # licenses not accepted"). En su lugar usamos el SDK que Ubuntu
      # ya trae preinstalado (en $ANDROID_HOME) y aceptamos las
      # licencias nosotros mismos.

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses --sdk_root="${ANDROID_HOME}"

      - name: Install Android SDK
        run: |
          sdkmanager --sdk_root="${ANDROID_HOME}" "platform-tools"
          sdkmanager --sdk_root="${ANDROID_HOME}" "platforms;android-35"
          sdkmanager --sdk_root="${ANDROID_HOME}" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleDebug

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Pronostico-Deportivo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
