name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: el token del workflow solo puede leer el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Auditoría de dependencias (falla con vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

      - name: Lint (TypeScript + sintaxis del servidor)
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build del frontend
        run: npm run build

      - name: Verificar datos versionados
        run: |
          node -e "
          import fs from 'fs';
          const min = { PD: 1000, CL: 600, PL: 1000, SA: 1000, BL1: 1000, FL1: 1000 };
          for (const [l, need] of Object.entries(min)) {
            const d = JSON.parse(fs.readFileSync('data/history/' + l + '.json', 'utf8'));
            const n = (d.matches || d).length;
            if (n < need) throw new Error(l + ': historial incompleto (' + n + ' partidos, mínimo ' + need + ')');
          }
          const r = JSON.parse(fs.readFileSync('data/backtest-report.json', 'utf8'));
          const p = JSON.parse(fs.readFileSync('data/model-params.json', 'utf8'));
          if (r.modelVersion !== p.modelVersion) throw new Error('backtest-report y model-params con versiones distintas');
          JSON.parse(fs.readFileSync('data/teams.json', 'utf8'));
          console.log('Datos OK');
          "

  secretos:
    name: Búsqueda de secretos filtrados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (todo el historial)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose --exit-code 1
